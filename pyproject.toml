[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "krystal"
version = "0.1.0"
description = "JAX package for optimal transport neural networks with tempering algorithms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Andy Tran" },
]
keywords = [
  "jax",
  "optimal-transport",
  "tempering",
  "annealing",
  "neural-networks",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jax>=0.4.30",
  "jaxlib>=0.4.30",
  "optax>=0.2.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/andytran/Krystal"

[tool.hatch.build.targets.wheel]
packages = ["src/krystal"]

# Map src/ layout so imports are `krystal`, not `src.krystal`.
[tool.hatch.build.targets.wheel.sources]
"src/krystal" = "krystal"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
